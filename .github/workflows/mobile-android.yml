name: Android beta

on:
  workflow_dispatch:
  pull_request:
    paths: ["mobile/android/**", ".github/workflows/mobile-android.yml"]
  push:
    branches: [main]
    paths: ["mobile/android/**", ".github/workflows/mobile-android.yml"]

permissions:
  contents: read

concurrency:
  group: android-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - name: Test, lint and build both Android variants
        run: ./gradlew --no-daemon testBetaDebugUnitTest lintBetaDebug assembleBetaDebug bundleProductionRelease
      - name: Record beta signing identity
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/beta/debug/app-beta-debug.apk > app/build/outputs/beta-signing.txt
          sha256sum app/build/outputs/apk/beta/debug/app-beta-debug.apk app/build/outputs/bundle/productionRelease/app-production-release.aab > app/build/outputs/SHA256SUMS
      - name: Keep installable beta and unsigned store bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: providerbeacon-android-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            mobile/android/app/build/outputs/apk/beta/debug/app-beta-debug.apk
            mobile/android/app/build/outputs/bundle/productionRelease/app-production-release.aab
            mobile/android/app/build/outputs/beta-signing.txt
            mobile/android/app/build/outputs/SHA256SUMS
            mobile/android/BETA.md
