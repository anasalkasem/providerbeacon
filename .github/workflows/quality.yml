name: Catalogue quality

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: catalogue-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-root-test-password
          MYSQL_DATABASE: providerbeacon_test
          MYSQL_USER: pbtest
          MYSQL_PASSWORD: local-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -plocal-root-test-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      TEST_DATABASE_URL: mysql://pbtest:local-test-password@127.0.0.1:3306/providerbeacon_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify pinned Agent Skills snapshot
        run: python3 .agents/verify-installation.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Check production HTML budget
        run: node -e 'const fs=require("node:fs"); const html=fs.readFileSync("dist/public/index.html","utf8"); const bytes=Buffer.byteLength(html); if(bytes>16000 || html.includes("id=\"manus-runtime\"")) process.exit(1); console.log("Production HTML bytes:",bytes)'
