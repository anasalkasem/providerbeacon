<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080b10" />
    <meta name="robots" content="noindex" />
    <title>ProviderBeacon — Offline</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        background: #080b10;
        color: #fff;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
      }
      main {
        max-width: 460px;
        width: 100%;
        padding: 32px;
        border: 1px solid #31353c;
        border-radius: 28px;
      }
      img {
        display: block;
        border-radius: 20px;
      }
      h1 {
        font-size: 32px;
        line-height: 1.35;
        font-weight: 600;
        margin: 28px 0 16px;
      }
      p {
        font-size: 16px;
        line-height: 1.8;
        color: #bfc5cf;
      }
      button {
        display: block;
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 24px;
        background: #8052ff;
        color: #fff;
        font: 600 16px system-ui;
        padding: 14px 24px;
        margin-top: 28px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid white;
        outline-offset: 4px;
      }
      .brand {
        font-size: 14px;
        letter-spacing: 0.08em;
        margin-top: 20px;
      }
    </style>
    <script src="/offline.js" defer></script>
  </head>
  <body>
    <main>
      <img src="/icon-192.png?v=pb1" alt="" width="64" height="64" />
      <p class="brand" dir="ltr">PROVIDERBEACON</p>
      <h1 id="offline-title">Let's reconnect.</h1>
      <p id="offline-body">
        You need an internet connection to search, see current prices and use
        Beacon AI. Your saved services will be available after you reconnect and
        sign in.
      </p>
      <button id="offline-retry" type="button">Try again</button>
    </main>
  </body>
</html>
